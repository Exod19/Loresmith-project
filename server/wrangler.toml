# API de Loresmith : un Worker Cloudflare avec une base D1.
# Lot 4 : usage local seulement (`npm run dev`). Aucun déploiement sans demande explicite :
# `database_id` est un identifiant local, à remplacer le jour où la base sera créée chez Cloudflare.
name = "loresmith-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Journaux (Workers Logs, inclus dans l'offre gratuite).
[observability]
enabled = true

# Sauvegarde quotidienne de la base dans R2 (vers 3 h, heure de Montréal).
[triggers]
crons = ["17 7 * * *"]

[vars]
BETTER_AUTH_URL = "http://localhost:8787"
# Origines du site (Vite en développement) autorisées à appeler l'API avec leurs cookies, séparées par des virgules.
FRONT_ORIGIN = "http://localhost:5173"
# Nombre de sauvegardes quotidiennes gardées dans R2.
BACKUP_KEEP = "30"
# Journaux : info | error | silent.
LOG_LEVEL = "info"
# Adresse du site dans les liens d'invitation (par défaut : FRONT_ORIGIN).
# APP_URL = "https://…"
# Courriels (Resend, offre gratuite) : MAIL_FROM ici, RESEND_API_KEY en secret (.dev.vars ou `wrangler secret`).
# Sans eux, le lien d'invitation est seulement montré à celui qui invite.
# MAIL_FROM = "Loresmith <invitations@exemple.org>"

[[d1_databases]]
binding = "DB"
database_name = "loresmith"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Images partagées et sauvegardes : Workers KV (gratuit, sans moyen de paiement ; cf. src/store.js).
# En local, Wrangler simule l'espace KV. `id` : identifiant de l'espace créé chez Cloudflare.
[[kv_namespaces]]
binding = "BLOBS"
id = "00000000000000000000000000000000"
