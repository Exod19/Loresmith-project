# API de Loresmith : un Worker Cloudflare avec une base D1.
# Lot 4 : usage local seulement (`npm run dev`). Aucun déploiement sans demande explicite :
# `database_id` est un identifiant local, à remplacer le jour où la base sera créée chez Cloudflare.
name = "loresmith-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
BETTER_AUTH_URL = "http://localhost:8787"
# Origine du site (Vite en développement) autorisée à appeler l'API avec ses cookies.
FRONT_ORIGIN = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "loresmith"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
